# Go/no-go pilot: does support_desk show an SOC/AOC gap that clears the noise floor?
# 20 seeds x 2 focal models x (1 SOC + 2 AOC) = 120 episodes.
run_id: pilot-sd1
env: support_desk
seeds: "1000:1020"
lineup:
  - {name: opus, provider: anthropic, model: claude-opus-5, max_tokens: 16384}
  - {name: sol, provider: openai, model: gpt-5.6-sol, max_tokens: 16384}
  - {name: grok, provider: openai_compat, model: x-ai/grok-4.6, max_tokens: 16384,
     base_url: "https://openrouter.ai/api/v1"}
  - {name: muse, provider: openai_compat, model: meta/muse-spark-1.2, max_tokens: 16384,
     base_url: "https://openrouter.ai/api/v1"}
focal_models: [opus, sol]
scripted_counterparts: [hardliner, reasonable, conceder]
adaptive_counterparts: [opus, sol, grok, muse]
self_null_replicates: 1
concurrency: 4
max_total_tokens: 4000000
