[project]
name = "parley-sim"
version = "0.0.1"
description = "Matched scripted-vs-adaptive counterpart evaluation for LLM agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
usersim = [
    "pyarrow>=15",
    "usersim>=0.3.0,<0.4",
]
gym = [
    "nemo-gym>=0.7,<0.8 ; python_full_version >= '3.13.14'",
]
openenv = [
    "openenv>=0.12,<0.13",
]

[project.scripts]
parley-sim = "parley_sim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parley_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "parley_sim"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "parley_sim.cli",
    "parley_sim.matched | parley_sim.adapters",
    "parley_sim.drivers | parley_sim.metrics",
    "parley_sim.runtime | parley_sim.envs",
    "parley_sim.trace",
    "parley_sim.core",
]

[tool.uv]
# nemo-gym pins anthropic<=0.109.2, older than the structured-output API the
# anthropic seat uses; resolve the two extras separately.
conflicts = [[{ extra = "gym" }, { extra = "anthropic" }]]
