name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra openai --extra anthropic --extra openenv
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run pytest -q
      - run: uv run parley-sim smoke --seeds 0:3

  gym:
    # nemo-gym needs Python 3.13.14+ and pins an anthropic SDK that conflicts
    # with the anthropic extra, so its adapter is tested on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra gym --extra openai
      - run: uv run pytest -q tests/test_nemo_gym_adapter.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
